<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<title>Pembuat Ikon Jadian</title>
<link rel="stylesheet" href="../www/css/fonts.css" />
<style>
  body { margin: 0; padding: 16px; background: #222; color: #eee; font-family: system-ui, sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; background: #333; padding: 8px; border-radius: 8px; }
  canvas { display: block; max-width: 240px; height: auto; background: repeating-conic-gradient(#555 0 25%, #444 0 50%) 0 0 / 16px 16px; }
  figcaption { font-size: 12px; margin-top: 6px; }
  a { color: #e2b04a; }
</style>
</head>
<body>
<h1>Pembuat Ikon Jadian</h1>
<p>Buka fail ni melalui server tempatan (<code>tools\serve.ps1</code>), kemudian tekan butang di bawah untuk simpan semua gambar terus ke folder projek. Pautan "Muat turun" juga ada untuk setiap gambar.</p>
<p><button id="saveAll" disabled>Simpan semua ke projek</button> <span id="status"></span></p>
<div class="grid" id="grid"></div>
<script>
// Logo harimau jadian (separuh muka orang, separuh harimau), sama dengan ikon "brand" dalam js/app.js.
const TIGER = '<circle cx="16" cy="16" r="13" fill="#e2b04a" stroke="#0b1121" stroke-width="2"/><path d="M16 3a13 13 0 0 1 0 26Z" fill="#18223d"/><path d="M6 12c2-4 6-6 10-6v6H6Z" fill="#f4efe2" stroke="#0b1121" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 12c1 7 4 12 9 14V12H7Z" fill="#d9a16c" stroke="#0b1121" stroke-width="1.8" stroke-linejoin="round"/><circle cx="11.5" cy="17" r="1.5" fill="#0b1121"/><path d="M16 6c5 0 9 3 10 8 1 6-3 11-10 12V6Z" fill="#f08a3c" stroke="#0b1121" stroke-width="1.8" stroke-linejoin="round"/><path d="M22 7l3-3v5M21 11l4 1M22 15l4 1M20 22l4 2" stroke="#0b1121" stroke-width="2" stroke-linecap="round"/><polygon points="18,15 24,13 22,18" fill="#e2b04a" stroke="#0b1121" stroke-width="1.4" stroke-linejoin="round"/><polygon points="16,22 19,22 18,26" fill="#f4efe2" stroke="#0b1121" stroke-width="1.3" stroke-linejoin="round"/><line x1="16" y1="3" x2="16" y2="29" stroke="#0b1121" stroke-width="2"/>';
const MALAM = '#0b1121', EMAS = '#e2b04a', TEKS = '#f4efe2';

function tigerImage(px) {
  return new Promise((ok) => {
    const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 32 32">${TIGER}</svg>`;
    const img = new Image(); img.onload = () => ok(img); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}
function sky(ctx, w, h, rounded) {
  const g = ctx.createRadialGradient(w / 2, h * .4, 0, w / 2, h * .4, Math.max(w, h) * .7);
  g.addColorStop(0, '#22305a'); g.addColorStop(1, MALAM);
  ctx.fillStyle = g;
  if (rounded) { ctx.beginPath(); ctx.roundRect(0, 0, w, h, w * .22); ctx.fill(); } else ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(244,239,226,.7)';
  [[.18, .19, .006], [.82, .16, .005], [.86, .37, .004], [.14, .45, .004]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x * w, y * h, r * w, 0, 7); ctx.fill(); });
}
function songket(ctx, cx, y, unit) {
  ctx.fillStyle = EMAS;
  [-2, -1, 0, 1, 2].forEach((i) => { const s = i === 0 ? unit * 1.4 : unit; const x = cx + i * unit * 3.6; ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.fill(); });
}
async function make(name, folder, w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  await draw(c.getContext('2d'), w, h);
  const url = c.toDataURL('image/png');
  window.__assets[name] = url; window.__folders = window.__folders || {}; window.__folders[name] = folder;
  const f = document.createElement('figure');
  f.innerHTML = `<figcaption><b>${name}</b> (${w}×${h}) → ${folder}<br><a download="${name}" href="${url}">Muat turun</a></figcaption>`;
  f.prepend(c); document.getElementById('grid').append(f);
}
// Ikon biasa: langit malam bucu bulat, harimau di tengah, jalur songket di bawah.
async function standard(ctx, w, h, rounded = true) {
  sky(ctx, w, h, rounded);
  const t = await tigerImage(w * .625); ctx.drawImage(t, w * .1875, h * .156, w * .625, w * .625);
  songket(ctx, w / 2, h * .867, w * .027);
}
window.__assets = {};
(async () => {
  await document.fonts.load('400 120px "Lilita One"');
  await document.fonts.load('700 60px "Plus Jakarta Sans"');
  await make('icon-512.png', 'www/assets/icons', 512, 512, (c, w, h) => standard(c, w, h));
  await make('icon-192.png', 'www/assets/icons', 192, 192, (c, w, h) => standard(c, w, h));
  await make('apple-touch-icon.png', 'www/assets/icons', 180, 180, (c, w, h) => standard(c, w, h, false));
  // Maskable: penuh tanpa bucu, harimau dalam zon selamat 60% di tengah (Android potong ikut bentuk telefon).
  await make('maskable-512.png', 'www/assets/icons', 512, 512, async (c, w, h) => { sky(c, w, h, false); const t = await tigerImage(w * .5); c.drawImage(t, w * .25, h * .25, w * .5, w * .5); });
  // Sumber untuk @capacitor/assets (APK): ikon penuh, latar depan lutsinar, latar belakang, logo dan skrin pembukaan.
  await make('icon-only.png', 'resources', 1024, 1024, (c, w, h) => standard(c, w, h, false));
  await make('icon-foreground.png', 'resources', 1024, 1024, async (c, w, h) => { const t = await tigerImage(w * .56); c.drawImage(t, w * .22, h * .22, w * .56, w * .56); });
  await make('icon-background.png', 'resources', 1024, 1024, (c, w, h) => { sky(c, w, h, false); });
  await make('logo.png', 'resources', 1024, 1024, async (c, w, h) => { const t = await tigerImage(w * .8); c.drawImage(t, w * .1, h * .1, w * .8, w * .8); });
  const splash = async (c, w, h) => {
    sky(c, w, h, false);
    const t = await tigerImage(w * .3); c.drawImage(t, w * .35, h * .3, w * .3, w * .3);
    c.textAlign = 'center'; c.fillStyle = TEKS; c.font = `400 ${Math.round(w * .085)}px "Lilita One", sans-serif`;
    c.fillText('JADI', w / 2 - w * .055, h * .72); c.fillStyle = '#f08a3c'; c.textAlign = 'left'; c.fillText('AN', w / 2 + w * .04, h * .72);
    c.textAlign = 'center'; c.fillStyle = EMAS; c.font = `700 ${Math.round(w * .028)}px "Plus Jakarta Sans", sans-serif`;
    c.fillText('Siapa harimau malam ni?', w / 2, h * .77);
    songket(c, w / 2, h * .82, w * .009);
  };
  await make('splash.png', 'resources', 2732, 2732, splash);
  await make('splash-dark.png', 'resources', 2732, 2732, splash);
  window.__assetsDone = true;
  const btn = document.getElementById('saveAll'); btn.disabled = false;
  btn.onclick = window.saveAll;
})();
// Hantar setiap PNG ke server tempatan (POST /__save/...), yang tulis fail ke folder projek.
window.saveAll = async function () {
  const st = document.getElementById('status'), done = [];
  for (const [name, url] of Object.entries(window.__assets)) {
    const blob = await (await fetch(url)).blob();
    const r = await fetch(`/__save/${window.__folders[name]}/${name}`, { method: 'POST', body: blob });
    done.push(`${name}:${r.status}`); st.textContent = done.join('  ');
  }
  return done;
};
</script>
</body>
</html>
